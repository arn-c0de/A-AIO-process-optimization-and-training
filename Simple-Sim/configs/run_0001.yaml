# Simple-Sim M0 Reference Configuration
# 400 samples (100 per class), single domain, 70/15/15 split

run:
  run_id: "run_0001"
  seed: 42
  schema_version: 1

roi:
  width_px: 256
  height_px: 256
  mm_per_px: 0.01  # 0.01 mm per pixel

geometry_ranges:
  # Nominal geometry sampling ranges (in pixels). Defaults match the original hardcoded values.
  pad_width: [25.0, 35.0]
  pad_height: [30.0, 40.0]
  pad_spacing: [50.0, 65.0]
  component_length: [55.0, 65.0]
  component_width: [25.0, 35.0]

classes:
  OK: 100
  MISSING: 100
  MISALIGNED: 100
  TOMBSTONE: 100

tolerances:
  "0603":
    ok_shift_px: 3.0          # shifts > 3px → MISALIGNED
    ok_rotation_deg: 5.0      # rotation > 5deg → MISALIGNED
    tombstone_tilt_deg: 75.0  # tilt >= 75deg → TOMBSTONE

domains:
  domain_A:  # Single domain for MVP
    lighting_brightness: [0.9, 1.1]
    blur_sigma: [0.0, 1.0]
    noise_stddev: [0.0, 10.0]

splits:
  train_domains: ['domain_A']
  val_domains: ['domain_A']
  test_domains: ['domain_A']
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15

render:
  backend: 'opencv_2d'
  substrate_color: [40, 90, 40]   # BGR: green solder mask
  copper_color: [60, 120, 180]    # BGR: copper pads
  component_color: [20, 20, 20]   # BGR: dark component
  solder_mask_alpha: 0.3

augment:
  rotation_deg_range: [-5, 5]
  brightness_factor_range: [0.85, 1.15]
  contrast_factor_range: [0.9, 1.1]

train:
  model: 'resnet18'
  pretrained: true
  epochs: 10
  batch_size: 32
  num_workers: 0
  lr: 0.001
  optimizer: 'adam'
  weight_decay: 0.0001

eval:
  batch_size: 64
  num_workers: 0
  metrics: ['accuracy', 'precision', 'recall', 'f1', 'confusion_matrix']
  critical_classes: ['MISSING', 'MISALIGNED', 'TOMBSTONE']
