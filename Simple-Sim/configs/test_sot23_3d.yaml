# Test SOT23 3D rendering

run:
  run_id: "test_sot23_3d"
  seed: 123
  schema_version: 2
  component_profile: "sot23_transistor_3d@1"

roi:
  width_px: 256
  height_px: 256
  mm_per_px: 0.01

classes:
  OK: 2
  MISSING: 1
  TOMBSTONE: 1

domains:
  domain_A:
    lighting_brightness: [1.0, 1.0]
    blur_sigma: [0.0, 0.0]
    noise_stddev: [0.0, 0.0]

splits:
  train_domains: ['domain_A']
  val_domains: ['domain_A']
  test_domains: ['domain_A']
  train_frac: 0.5
  val_frac: 0.25
  test_frac: 0.25

render:
  backend: 'blender_3d'
  blender:
    executable: "blender"
    engine: "CYCLES"
    samples: 32
    device: "CPU"

augment:
  rotation_deg_range: [0, 0]
  brightness_factor_range: [1.0, 1.0]
  contrast_factor_range: [1.0, 1.0]

train:
  model: 'resnet18'
  pretrained: true
  epochs: 1
  batch_size: 4
  num_workers: 0
  lr: 0.001
  optimizer: 'adam'
  weight_decay: 0.0001

eval:
  batch_size: 4
  num_workers: 0
  metrics: ['accuracy']
  critical_classes: ['MISSING', 'TOMBSTONE']
