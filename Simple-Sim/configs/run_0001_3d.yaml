# Simple-Sim 3D reference configuration (Blender batch)

run:
  run_id: "run_0001_3d"
  seed: 42
  schema_version: 2
  component_profile: "chip_0603_resistor_3d@1"

roi:
  width_px: 256
  height_px: 256
  mm_per_px: 0.01

classes:
  OK: 100
  MISSING: 100
  MISALIGNED: 100
  TOMBSTONE: 100

domains:
  domain_A:
    lighting_brightness: [0.9, 1.1]
    blur_sigma: [0.0, 0.0]       # post-aug on 3D output is optional; keep deterministic for now
    noise_stddev: [0.0, 0.0]

splits:
  train_domains: ['domain_A']
  val_domains: ['domain_A']
  test_domains: ['domain_A']
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15

render:
  backend: 'blender_3d'
  blender:
    executable: "blender"
    engine: "CYCLES"
    samples: 64
    device: "CPU"

augment:
  rotation_deg_range: [-3, 3]
  brightness_factor_range: [1.0, 1.0]
  contrast_factor_range: [1.0, 1.0]

train:
  model: 'resnet18'
  pretrained: true
  epochs: 10
  batch_size: 32
  num_workers: 0
  lr: 0.001
  optimizer: 'adam'
  weight_decay: 0.0001

eval:
  batch_size: 64
  num_workers: 0
  metrics: ['accuracy', 'precision', 'recall', 'f1', 'confusion_matrix']
  critical_classes: ['MISSING', 'MISALIGNED', 'TOMBSTONE']
