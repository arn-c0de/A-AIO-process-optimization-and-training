# BOTTOM judge weakness: 0603 resistors (chip_0603_resistor@2, 100 px/mm) with solder bridges and missing parts in the
# DeepVision BOTTOM look (dv_bottom). Same profile and seed as run_0001.yaml; the dv_bottom preset crops 3 body lengths
# at 16 px/mm.
# roi.mm_per_px = 0.02667 (37.5 px/mm): the @2 profile draws the 1.6 mm body as 55-65 px, so this is its
# physical scale (run_0001.yaml keeps the nominal 0.01); the dv_bottom preset then crops 3 body lengths = ~4.9 mm at 16 px/mm (~79 px).
run:
  run_id: run_0603_r_dv_bottom
  seed: 42
  schema_version: 2
  component_profile: chip_0603_resistor@2
roi:
  width_px: 256
  height_px: 256
  mm_per_px: 0.02667
classes:
  OK: 300
  SOLDER_BRIDGE: 250
  EXCESS_SOLDER: 150
  MISSING: 120
  MISALIGNED: 60
  TOMBSTONE: 40
  SOLDER_BALL: 40
domains:
  domain_A:
    lighting_brightness:
    - 0.95
    - 1.05
    blur_sigma:
    - 0.0
    - 0.3
    noise_stddev:
    - 0.0
    - 2.0
splits:
  train_domains:
  - domain_A
  val_domains:
  - domain_A
  test_domains:
  - domain_A
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
render:
  backend: opencv_2d
  substrate_color:
  - 40
  - 90
  - 40
  copper_color:
  - 60
  - 120
  - 180
  solder_mask_alpha: 0.3
  look: dv_bottom
  post_filters: camera
augment:
  rotation_deg_range:
  - -5
  - 5
  brightness_factor_range:
  - 0.85
  - 1.15
  contrast_factor_range:
  - 0.9
  - 1.1
train:
  model: resnet18
  pretrained: true
  epochs: 10
  batch_size: 32
  num_workers: 0
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0001
eval:
  batch_size: 64
  num_workers: 0
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - confusion_matrix
  critical_classes:
  - MISSING
  - MISALIGNED
  - TOMBSTONE
