run:
  run_id: "run_qfn32_v1"
  seed: 2026
  schema_version: 2
  component_profile: "qfn32_ic@1"

roi:
  width_px: 768
  height_px: 768
  mm_per_px: 0.01

classes:
  OK: 200
  MISSING: 200
  MISALIGNED: 200
  SOLDER_BRIDGE: 200
  CORNER_LIFT: 200

domains:
  domain_A:
    lighting_brightness: [0.8, 1.3]
    blur_sigma: [0.0, 1.5]
    noise_stddev: [0.0, 12.0]

splits:
  train_domains: ['domain_A']
  val_domains: ['domain_A']
  test_domains: ['domain_A']
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15

render:
  backend: 'opencv_2d'
  substrate_color: [35, 70, 40]
  copper_color: [90, 130, 200]
  solder_mask_alpha: 0.4

augment:
  rotation_deg_range: [-4, 4]
  brightness_factor_range: [0.85, 1.2]
  contrast_factor_range: [0.8, 1.2]

train:
  model: 'resnet18'
  pretrained: true
  epochs: 14
  batch_size: 32
  num_workers: 0
  lr: 0.0006
  optimizer: 'adam'
  weight_decay: 0.0001

eval:
  batch_size: 64
  num_workers: 0
  metrics: ['accuracy', 'precision', 'recall', 'f1', 'confusion_matrix']
  critical_classes: ['MISSING', 'MISALIGNED', 'SOLDER_BRIDGE', 'CORNER_LIFT']
