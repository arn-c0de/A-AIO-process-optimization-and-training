# Component Profile (Schema v1, 3D)

profile:
  profile_id: "sot23_transistor_3d@2"
  schema_version: 1
  supported_render_backends: ["blender_3d"]
  description: "SOT-23 3D (Blender/Cycles): simple PBR scene for AOI-style ROI"
  created_at: "2026-11-06T00:00:00Z"

component:
  type: "sot_transistor"
  footprint: "sot23"
  package: "SOT-23"
  nominal_dims_mm:
    length: 3.0
    width: 1.25
    height: 1.0

geometry_ranges:
  # Same semantics as the 2D profile: the Blender backend uses the 2D pad layout (pixels at roi.mm_per_px).
  pad_width: [24.0, 32.0]
  pad_height: [30.0, 40.0]
  pad_spacing: [52.0, 64.0]
  pad_spacing_y: [36.0, 50.0]
  component_length: [56.0, 66.0]
  component_width: [26.0, 34.0]

tolerances:
  ok_shift_px: 4.0
  ok_rotation_deg: 6.0
  tombstone_tilt_deg: 75.0

defect_set:
  - "OK"
  - "MISSING"
  - "MISALIGNED"
  - "TOMBSTONE"
  - "SOLDER_BALL"
  - "EXCESS_SOLDER"

render_3d:
  camera:
    # AOI top camera: straight down (orthographic, framed to the ROI by the renderer).
    location_mm: [0.0, 0.0, 14.0]
    look_at_mm: [0.0, 0.0, 0.0]
    focal_length_mm: 40.0
  lighting:
    # AOI ring light around the camera axis; defaults are calibrated to the baked board colours.
    ring_light: {}
  materials:
    # Board (mask, copper, silkscreen) comes from the shared 2D generator; only the 3D parts are set here.
    body:
      base_color: [0.02, 0.02, 0.02]
      roughness: 0.60
      metallic: 0.0
    solder:
      base_color: [0.70, 0.70, 0.72]
      roughness: 0.18
      metallic: 1.0
