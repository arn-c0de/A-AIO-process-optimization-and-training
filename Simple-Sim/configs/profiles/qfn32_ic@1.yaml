# Component Profile (Schema v1)
#
# This file defines a *versioned* component profile used by the generation pipeline.
# It is selected via `run.component_profile: qfn32_ic@1` in a run config and loaded by
# `scripts/generate.py` from `configs/profiles/`.
#
# What the code uses from this profile (current implementation):
# - `component.footprint` is written into `meta.jsonl` as `footprint`.
# - `geometry_ranges` drives nominal geometry sampling in `simple_sim/generator_2d.py`.
# - `tolerances` drives defect parameter sampling + class labeling in `simple_sim/defects.py`
#   and also affects tombstone rendering threshold in `simple_sim/generator_2d.py`.
# - `render.component_color_bgr` is merged into `render.component_color` if the run config
#   does not specify a component color (schema v2 behavior).
#
# Notes for QFN profiles:
# - Uses standard defect set (OK, MISSING, MISALIGNED, TOMBSTONE).
# - SOLDER_BRIDGE and CORNER_LIFT removed: not distinguishable from MISALIGNED in 2D rendering.
#
# Units and conventions:
# - `geometry_ranges` values are in *pixels* at the ROI scaling (`roi.mm_per_px`) used by
#   the run config. If you change `roi.mm_per_px`, you usually must re-tune these ranges.
# - `tolerances.ok_shift_px` is pixels; `ok_rotation_deg` and `tombstone_tilt_deg` are degrees.
# - Colors are BGR order (OpenCV convention): [blue, green, red], each 0..255.
#
# Versioning and hashing:
# - The pipeline computes a deterministic SHA256 hash for this file (excluding metadata
#   fields like `profile.description` and `profile.created_at`). Any semantic changes to
#   geometry/tolerances/defect_set will change the hash and will be rejected when extending
#   existing datasets. Create a new profile version (e.g. `...@2`) for such changes.
#
profile:
  profile_id: qfn32_ic@1
  schema_version: 1
  supported_render_backends: ["opencv_2d"]
  description: "QFN-32 IC (flat body, 32 land pads around perimeter)"
  created_at: "2026-02-14T12:00:00Z"

component:
  type: qfn_ic
  footprint: qfn_32
  package: QFN-32
  nominal_dims_mm:
    length: 5.0
    width: 5.0
    height: 0.85

geometry_ranges:
  pad_width: [45.0, 55.0]
  pad_height: [110.0, 130.0]
  pad_spacing: [520.0, 560.0]       # horizontal (X) distance between left/right pad rows
  pad_spacing_y: [520.0, 560.0]     # vertical (Y) distance between top/bottom pad rows
  component_length: [485.0, 515.0]
  component_width: [485.0, 515.0]

tolerances:
  ok_shift_px: 5.0
  ok_rotation_deg: 3.0
  tombstone_tilt_deg: 70.0

defect_set:
  - OK
  - MISSING
  - MISALIGNED
  - TOMBSTONE

render:
  component_color_bgr: [6, 6, 6]
