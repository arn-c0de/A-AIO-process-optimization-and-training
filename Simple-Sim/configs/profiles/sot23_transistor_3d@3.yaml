# Component Profile (Schema v1, 3D)

# @3 (vs @2): real SOT-23 land/body proportions (as sot23_transistor@2); @2 had ~1.3 x 1.3 mm pads
# that hid the leads. @2 stays for datasets and models created with it.

profile:
  profile_id: "sot23_transistor_3d@3"
  schema_version: 1
  supported_render_backends: ["blender_3d"]
  description: "SOT-23 3D (Blender/Cycles): simple PBR scene for AOI-style ROI"
  created_at: "2026-11-06T00:00:00Z"

component:
  type: "sot_transistor"
  footprint: "sot23"
  package: "SOT-23"
  nominal_dims_mm:
    length: 3.0
    width: 1.25
    height: 1.0

geometry_ranges:
  # Same pixel geometry as sot23_transistor@2 (real SOT-23 proportions): body long axis along the
  # pin-1/2 column, lands ~1.0 x 0.7 mm relative to a 2.9 x 1.3 mm body.
  pad_width: [20.0, 25.0]
  pad_height: [16.0, 20.0]
  pad_spacing: [46.0, 54.0]
  pad_spacing_y: [40.0, 44.0]
  component_length: [61.0, 66.0]
  component_width: [27.0, 31.0]

tolerances:
  ok_shift_px: 4.0
  ok_rotation_deg: 6.0
  tombstone_tilt_deg: 75.0

defect_set:
  - "OK"
  - "MISSING"
  - "MISALIGNED"
  - "TOMBSTONE"
  - "SOLDER_BALL"
  - "EXCESS_SOLDER"

render_3d:
  camera:
    # AOI top camera: straight down (orthographic, framed to the ROI by the renderer).
    location_mm: [0.0, 0.0, 14.0]
    look_at_mm: [0.0, 0.0, 0.0]
    focal_length_mm: 40.0
  lighting:
    # AOI ring light around the camera axis; defaults are calibrated to the baked board colours.
    ring_light: {}
  materials:
    # Board (mask, copper, silkscreen) comes from the shared 2D generator; only the 3D parts are set here.
    body:
      base_color: [0.02, 0.02, 0.02]
      roughness: 0.60
      metallic: 0.0
    solder:
      base_color: [0.70, 0.70, 0.72]
      roughness: 0.18
      metallic: 1.0
