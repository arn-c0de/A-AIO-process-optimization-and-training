# Component Profile (Schema v1)
#
# This file defines a *versioned* component profile used by the generation pipeline.
# It is selected via `run.component_profile: sot23_transistor@2` in a run config and
# loaded by `scripts/generate.py` from `configs/profiles/`.
#
# What the code uses from this profile (current implementation):
# - `component.footprint` is written into `meta.jsonl` as `footprint`.
# - `geometry_ranges` drives nominal geometry sampling in `simple_sim/generator_2d.py`.
# - `tolerances` drives defect parameter sampling + class labeling in `simple_sim/defects.py`
#   and also affects tombstone rendering threshold in `simple_sim/generator_2d.py`.
# - `render.component_color_bgr` is merged into `render.component_color` if the run config
#   does not specify a component color (schema v2 behavior).
#
# Units and conventions:
# - `geometry_ranges` values are in *pixels* at the ROI scaling (`roi.mm_per_px`) used by
#   the run config. If you change `roi.mm_per_px`, you usually must re-tune these ranges.
# - `tolerances.ok_shift_px` is pixels; `ok_rotation_deg` and `tombstone_tilt_deg` are degrees.
# - Colors are BGR order (OpenCV convention): [blue, green, red], each 0..255.
#
# Versioning and hashing:
# - The pipeline computes a deterministic SHA256 hash for this file (excluding metadata
#   fields like `profile.description` and `profile.created_at`). Any semantic changes to
#   geometry/tolerances/defect_set will change the hash and will be rejected when extending
#   existing datasets. Create a new profile version (e.g. `...@2`) for such changes.
#
# @2 (vs @1): real SOT-23 proportions at ~22 px/mm (pin 1-2 pitch 1.9 mm = ~42 px): body 2.9 x 1.3 mm
# with its long axis along the pin-1/2 column, land pads ~1.0 x 0.7 mm (@1 had ~1.3 x 1.3 mm pads that
# hid the gull-wing leads). @1 stays for datasets and models created with it.
# Scale: the pixel sizes below are the real package drawn at ~22 px/mm (physical mm_per_px ~0.045).
# The run configs (run_sot23.yaml: roi.mm_per_px 0.01) keep the generic profile scale instead, so
# mm values derived from roi.mm_per_px (board model, 3D scene) are not the physical package size;
# the board model scales its design rules from the pad size, not from mm_per_px.

profile:
  profile_id: sot23_transistor@2
  schema_version: 1
  supported_render_backends: ["opencv_2d"]
  description: "SOT-23 transistor (3 leads, 2.9x1.3 mm body) on a three-pad footprint, real land proportions"
  created_at: "2026-11-06T00:00:00Z"

component:
  type: sot_transistor
  footprint: sot23
  package: SOT-23
  nominal_dims_mm:
    length: 3.0
    width: 1.25
    height: 1.0

geometry_ranges:
  # Pixels (drawn at ~22 px/mm, see the scale note above). component_length runs along the pin-1/2 column (vertical), width across.
  pad_width: [20.0, 25.0]           # pad extent across the body (x), ~1.0 mm
  pad_height: [16.0, 20.0]          # pin 3 pad along y; pins 1/2 use 0.8x of it (~0.6-0.7 mm)
  pad_spacing: [46.0, 54.0]         # x distance between the pad columns (~2.2 mm)
  pad_spacing_y: [40.0, 44.0]       # pin 1 to pin 2 (1.9 mm)
  component_length: [61.0, 66.0]    # 2.9 mm
  component_width: [27.0, 31.0]     # 1.3 mm

tolerances:
  ok_shift_px: 4.0
  ok_rotation_deg: 6.0
  tombstone_tilt_deg: 75.0

defect_set:
  - OK
  - MISSING
  - MISALIGNED
  - TOMBSTONE

render:
  component_color_bgr: [18, 18, 18]
