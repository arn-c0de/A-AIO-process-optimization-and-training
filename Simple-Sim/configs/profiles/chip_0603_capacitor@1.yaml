# Component Profile (Schema v1)
#
# 0603 MLCC (CAPC1608, DeepVision xpa: 54 parts) for the DeepVision BOTTOM exports (round 2). Pixel geometry copied
# from chip_0603_resistor@2 (body 55-65 px): at roi.mm_per_px 0.02667 (37.5 px/mm) that is the physical 1.6 mm body.
# component.type chip_capacitor -> family "capacitor": the renderer draws the ceramic body in the look's measured
# MLCC colour (dv_bottom: BGR (85, 106, 113), real bottom CAPC1608 centre (88, 108, 124)); the dark default
# component_color_bgr keeps that look colour (a light explicit colour would override it, see parts.draw_body).
profile:
  profile_id: chip_0603_capacitor@1
  schema_version: 1
  supported_render_backends:
  - opencv_2d
  description: 0603 MLCC 1.6x0.8 mm (CAPC1608), geometry of chip_0603_resistor@2,
    tan ceramic body from the look
  created_at: '2026-11-08T00:00:00Z'
component:
  type: chip_capacitor
  footprint: chip_2pad
  package: 0603 (CAPC1608)
  nominal_dims_mm:
    length: 1.6
    width: 0.8
    height: 0.8
geometry_ranges:
  pad_width:
  - 25.0
  - 35.0
  pad_height:
  - 30.0
  - 40.0
  pad_spacing:
  - 50.0
  - 65.0
  component_length:
  - 55.0
  - 65.0
  component_width:
  - 25.0
  - 35.0
tolerances:
  ok_shift_px: 3.0
  ok_rotation_deg: 5.0
  tombstone_tilt_deg: 30.0
defect_set:
- OK
- MISSING
- MISALIGNED
- TOMBSTONE
- SOLDER_BRIDGE
- SOLDER_BALL
- EXCESS_SOLDER
render:
  component_color_bgr:
  - 20
  - 20
  - 20
