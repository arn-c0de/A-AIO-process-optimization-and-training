# BOTTOM judge weakness: missing 0402 resistors (RESC1005). MISSING-heavy mix in the DeepVision BOTTOM look (black body
# on the dark olive mask). DeepVision hypothesis: real missing parts leave solder residue on the pads, not clean pads;
# render.missing_residue 1.5 raises the reflowed-paste domes on the empty pads to 1.5x the look's default (0 would be
# bare pads, 1 the default; the domes are drawn as flat solder under the dv_bottom ring light).
# roi.mm_per_px = 1 / 62 px/mm (the profile's pixel scale).
run:
  run_id: run_0402_r_dv_bottom_missing
  seed: 42
  schema_version: 2
  component_profile: chip_0402_resistor@1
roi:
  width_px: 256
  height_px: 256
  mm_per_px: 0.01613
classes:
  OK: 300
  MISSING: 400
  MISALIGNED: 80
  TOMBSTONE: 60
  SOLDER_BALL: 40
  EXCESS_SOLDER: 40
domains:
  domain_A:
    lighting_brightness:
    - 0.95
    - 1.05
    blur_sigma:
    - 0.0
    - 0.3
    noise_stddev:
    - 0.0
    - 2.0
splits:
  train_domains:
  - domain_A
  val_domains:
  - domain_A
  test_domains:
  - domain_A
  train_frac: 0.7
  val_frac: 0.15
  test_frac: 0.15
render:
  backend: opencv_2d
  substrate_color:
  - 40
  - 90
  - 40
  copper_color:
  - 60
  - 120
  - 180
  solder_mask_alpha: 0.3
  look: dv_bottom
  post_filters: camera
  missing_residue: 1.5
augment:
  rotation_deg_range:
  - -5
  - 5
  brightness_factor_range:
  - 0.85
  - 1.15
  contrast_factor_range:
  - 0.9
  - 1.1
train:
  model: resnet18
  pretrained: true
  epochs: 10
  batch_size: 32
  num_workers: 0
  lr: 0.001
  optimizer: adam
  weight_decay: 0.0001
eval:
  batch_size: 64
  num_workers: 0
  metrics:
  - accuracy
  - precision
  - recall
  - f1
  - confusion_matrix
  critical_classes:
  - MISSING
  - MISALIGNED
  - TOMBSTONE
