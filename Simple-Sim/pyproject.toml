[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-sim"
description = "Synthetic PCB-defect ROI generator and ResNet18 train/eval pipeline"
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
# Core: config, schema, manifests, reports, 2D rendering and dataset generation.
dependencies = [
    "numpy",
    "opencv-python",
    "PyYAML",
    "tqdm",
]

[project.optional-dependencies]
# Training, evaluation, prediction (simple_sim.models, data_loader, eval_utils).
train = ["torch", "torchvision"]
# Tk monitor GUI and profile editor (tkinter itself comes from the system Python).
gui = ["pillow", "matplotlib>=3.10.8", "imagehash>=4.3.2"]
# scikit-learn only for the metrics parity test (simple_sim.metrics is numpy-only).
dev = ["pytest", "scikit-learn"]
all = ["simple-sim[train,gui,dev]"]

[project.scripts]
simple-sim = "simple_sim.cli:main"

[tool.setuptools.dynamic]
version = { attr = "simple_sim.__version__" }

[tool.setuptools.packages.find]
include = ["simple_sim*"]

[tool.setuptools.package-data]
# The Blender batch script runs inside Blender (no package import), it ships as a data file.
simple_sim = ["blender/*.py"]

[tool.pytest.ini_options]
# Tests import gui/, scripts/ and tools/ from the checkout, which are not installed.
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 130
extend-exclude = ["outputs", "images", "docs"]

[tool.ruff.lint]
# Correctness and modernisation only; formatting / style rules are deliberately off (the code
# base keeps its own layout). `ruff check .` must stay clean; run it before committing.
select = ["F", "E9", "B", "UP", "PLE", "PLW1510"]
ignore = [
    "B023",  # closures over loop variables that are called inside the same iteration (arena, batch_predict)
    "B905",  # zip() strictness is decided per call site, not globally
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008", "B018"]
